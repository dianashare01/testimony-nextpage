<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141A26">
<title>증언: 다음 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141A26;
    --ink: #F1EEE6;
    --ink-sub: #B5BDCB;
    --line: #46536B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }

  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px calc(40px + env(safe-area-inset-bottom));
  }

  main {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .office {
    font-size: 13px;
    letter-spacing: .14em;
    color: var(--ink-sub);
  }

  .rule {
    width: 40px;
    height: 1px;
    background: var(--line);
  }

  h1 {
    font-family: 'Noto Serif KR', 'Nanum Myeongjo', serif;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: .01em;
    word-break: keep-all;
  }

  @media (min-width: 600px) {
    h1 { font-size: 38px; }
  }
</style>
</head>
<body>

<main>
  <p class="office">사무국 · 디아나인사이트</p>
  <div class="rule"></div>
  <h1>준비 중입니다.</h1>
</main>

</body>
</html>
